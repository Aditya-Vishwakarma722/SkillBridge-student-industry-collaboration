<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Gap Analytics — SkillBridge</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/design-system.css">
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-900">

  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 py-8 w-full space-y-6">

    <!-- Header Banner -->
    <div class="sb-card p-6 sm:p-8 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6 border-slate-200">
      <div class="space-y-1.5">
        <div class="flex items-center gap-2">
          <span class="sb-badge sb-badge-blue">Academic Intelligence</span>
          <span class="sb-badge sb-badge-muted">Skill Matrix</span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">Institutional Skill Gap Analytics</h1>
        <p class="text-xs sm:text-sm text-slate-600 max-w-xl">
          Evaluate competency vectors across the student population to optimize curricula and targeted placement drives.
        </p>
      </div>

      <div class="flex items-center gap-2.5">
        <a href="department-performance.html" class="sb-btn sb-btn-primary">
          <span class="material-symbols-outlined text-[16px]">domain</span>
          <span>Department Comparison</span>
        </a>
        <a href="index.html" class="sb-btn sb-btn-secondary">
          <span class="material-symbols-outlined text-[16px]">bar_chart</span>
          <span>Overview</span>
        </a>
      </div>
    </div>

    <!-- Analytics Breakdown Cards Grid -->
    <div id="analytics-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Populated via script -->
    </div>

  </main>

  <script src="../js/store.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    function renderSkillAnalytics() {
      if (!window.SkillBridgeStore) return;
      const data = window.SkillBridgeStore.getInstitutionData('Apex Institute of Technology');
      const container = document.getElementById('analytics-grid');
      container.innerHTML = '';

      const skillTotals = data.skillTotals || {};
      const entries = Object.entries(skillTotals);

      if (entries.length === 0) {
        container.innerHTML = `
          <div class="col-span-full sb-card p-12 text-center space-y-3">
            <span class="material-symbols-outlined text-slate-400 text-4xl">psychology</span>
            <div class="text-sm text-slate-600 font-medium">No skill assessments logged yet.</div>
          </div>
        `;
        return;
      }

      for (const [skill, stats] of entries) {
        if (skill === 'Platform Activities') continue;
        const avg = Math.round(stats.totalScore / stats.count);
        const readyPct = Math.round((stats.ready / stats.count) * 100);

        const card = document.createElement('div');
        card.className = 'sb-card p-6 space-y-4 sb-card-interactive';
        card.innerHTML = `
          <div class="flex items-start justify-between">
            <div>
              <h3 class="text-base font-bold text-slate-900">${skill}</h3>
              <p class="text-xs text-slate-500">Mean Score: <strong class="text-slate-800 font-mono">${avg}</strong> / 1000</p>
            </div>
            <span class="sb-badge ${readyPct >= 60 ? 'sb-badge-emerald' : 'sb-badge-amber'}">
              ${readyPct}% Industry Ready
            </span>
          </div>

          <div class="space-y-1.5">
            <div class="flex justify-between text-xs text-slate-500">
              <span>Readiness Progress</span>
              <span>${stats.ready} of ${stats.count} students</span>
            </div>
            <div class="sb-progress-track">
              <div class="sb-progress-fill ${readyPct >= 60 ? 'bg-emerald-600' : 'bg-amber-500'}" style="width: ${readyPct}%"></div>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3 text-xs pt-2 border-t border-slate-100">
            <div class="sb-card-elevated p-3">
              <span class="text-slate-500 text-[11px]">Qualified (&ge; 700 pts):</span>
              <p class="font-bold text-emerald-700 mt-0.5 font-mono">${stats.ready} Students</p>
            </div>
            <div class="sb-card-elevated p-3">
              <span class="text-slate-500 text-[11px]">Need Upgrade (&lt; 700):</span>
              <p class="font-bold text-amber-700 mt-0.5 font-mono">${stats.needImprovement} Students</p>
            </div>
          </div>

          <div class="text-[11px] text-slate-600 bg-slate-50 p-3 border border-slate-200 flex items-start gap-2">
            <span class="material-symbols-outlined text-blue-600 text-sm mt-0.5">lightbulb</span>
            <div>
              <strong class="text-slate-800">Recommendation:</strong>
              ${readyPct >= 60 
                ? 'Strong cohort competency. Target top-tier campus recruitment partners.' 
                : 'Deficit identified. Deploy targeted laboratory sprints and reassessment drives.'}
            </div>
          </div>
        `;
        container.appendChild(card);
      }
    }

    window.addEventListener('skillbridge-state-change', renderSkillAnalytics);
    window.addEventListener('skillbridge:update', renderSkillAnalytics);
    document.addEventListener('DOMContentLoaded', renderSkillAnalytics);
  </script>
</body>
</html>
