<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Aditya University — Student Directory</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet"/>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          primary: "#f2ca50",
          "primary-container": "#d4af37",
          surface: "#0f131f",
          "surface-container": "#1b1f2c"
        }
      }
    }
  };
</script>
<style>
  body {
    background: #0f131f;
    color: #dfe2f3;
    font-family: 'Inter', sans-serif;
  }
  .glass-pane {
    background-color: rgba(22, 27, 46, 0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
</style>
</head>
<body class="min-h-screen bg-[#0f131f] text-[#dfe2f3] flex flex-col">

<main class="flex-1 p-4 md:p-8 max-w-[1200px] mx-auto w-full space-y-6">

  <!-- Header Banner -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-white/10 pb-4">
    <div>
      <h1 class="text-2xl font-bold font-serif text-indigo-400">Aditya University — Enrolled Students Directory</h1>
      <p class="text-xs text-zinc-400">View student profiles, department affiliations, academic standing, and verified skill scores.</p>
    </div>
    
    <div class="flex items-center gap-3">
      <input id="searchStudent" oninput="renderStudentsTable()" placeholder="Search student name, department..." class="bg-[#161B2E] border border-white/10 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-400">
    </div>
  </div>

  <!-- Students Table Grid -->
  <div class="glass-pane rounded-2xl p-6 space-y-4">
    <div class="overflow-x-auto">
      <table class="w-full text-left text-xs text-zinc-300">
        <thead class="bg-black/40 text-amber-300 uppercase text-[10px] tracking-wider border-b border-white/10">
          <tr>
            <th class="py-3 px-4">Student Name</th>
            <th class="py-3 px-4">College & Dept</th>
            <th class="py-3 px-4">CGPA</th>
            <th class="py-3 px-4">Assessed Skills</th>
            <th class="py-3 px-4">Placement Readiness</th>
          </tr>
        </thead>
        <tbody id="students-table-body" class="divide-y divide-white/5">
          <!-- Populated via store.js -->
        </tbody>
      </table>
    </div>
  </div>

</main>

<script src="../js/store.js"></script>
<script src="../js/nav.js"></script>
<script>
  function renderStudentsTable() {
    if (!window.SkillBridgeStore) return;

    const data = window.SkillBridgeStore.getInstitutionData('Aditya University');
    const search = document.getElementById('searchStudent').value.toLowerCase().trim();

    const body = document.getElementById('students-table-body');
    body.innerHTML = '';

    const filtered = data.students.filter(s => {
      return !search || s.name.toLowerCase().includes(search) || (s.department || '').toLowerCase().includes(search);
    });

    if (filtered.length === 0) {
      body.innerHTML = `
        <tr>
          <td colspan="5" class="py-8 text-center text-zinc-500">
            No students found for Aditya University.
          </td>
        </tr>
      `;
      return;
    }

    filtered.forEach(s => {
      let skillChips = '';
      let avgScore = 0;
      let count = 0;

      if (s.skills) {
        for (const [skill, score] of Object.entries(s.skills)) {
          count++;
          avgScore += score;
          skillChips += `<span class="px-2 py-0.5 rounded bg-white/10 text-[10px] text-zinc-300 mr-1 mb-1 inline-block">${skill}: <strong class="text-amber-400">${score}</strong></span>`;
        }
      }
      avgScore = count > 0 ? Math.round(avgScore / count) : 70;
      const readinessStatus = avgScore >= 75 ? 'Industry Ready (High)' : avgScore >= 60 ? 'Good Readiness' : 'Developing';
      const readinessColor = avgScore >= 75 ? 'text-emerald-400' : avgScore >= 60 ? 'text-amber-400' : 'text-rose-400';

      body.innerHTML += `
        <tr class="hover:bg-white/5 transition-colors">
          <td class="py-3 px-4 font-bold text-white flex items-center gap-2">
            <span class="material-symbols-outlined text-amber-400 text-lg">person</span>
            <div>
              <div>${s.name}</div>
              <div class="text-[10px] text-zinc-400 font-normal">${s.email}</div>
            </div>
          </td>
          <td class="py-3 px-4">
            <div class="text-white font-medium">${s.college || 'Aditya University'}</div>
            <div class="text-[11px] text-indigo-300">${s.department || 'CSE'} | ${s.year || '3rd Year'}</div>
          </td>
          <td class="py-3 px-4 font-bold text-white">${s.cgpa || '8.7'}</td>
          <td class="py-3 px-4">
            <div class="flex flex-wrap max-w-xs">${skillChips}</div>
          </td>
          <td class="py-3 px-4">
            <span class="font-bold ${readinessColor}">${readinessStatus}</span>
            <div class="text-[10px] text-zinc-400">Avg Skill Vector: ${avgScore}%</div>
          </td>
        </tr>
      `;
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderStudentsTable();
    window.addEventListener('skillbridge-state-change', renderStudentsTable);
  });
</script>
</body>
</html>
