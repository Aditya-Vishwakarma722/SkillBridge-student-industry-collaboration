<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidate Pipeline — SkillBridge</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/design-system.css">
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-900">

  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 py-8 w-full space-y-6">

    <!-- Header Banner -->
    <div class="sb-card p-6 sm:p-8 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6 border-slate-200">
      <div class="space-y-1.5">
        <div class="flex items-center gap-2">
          <span class="sb-badge sb-badge-emerald">Candidate Review</span>
          <span class="sb-badge sb-badge-blue">Skill-Verified</span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">Applicant Pipeline</h1>
        <p class="text-xs sm:text-sm text-slate-600 max-w-xl">
          Review candidates whose skill scores meet your thresholds and who completed proctored screening evaluations.
        </p>
      </div>

      <div class="flex items-center gap-2">
        <a href="shortlisted.html" class="sb-btn sb-btn-secondary">
          <span class="material-symbols-outlined text-[16px]">verified</span>
          <span>Shortlisted Pool</span>
        </a>
        <a href="opportunities.html" class="sb-btn sb-btn-primary">
          <span class="material-symbols-outlined text-[16px]">post_add</span>
          <span>Postings</span>
        </a>
      </div>
    </div>

    <!-- Candidate Pipeline Cards List -->
    <div id="applicants-container" class="space-y-4">
      <!-- Populated via script -->
    </div>

  </main>

  <script src="../js/store.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    function renderApplicants() {
      if (!window.SkillBridgeStore) return;
      const comp = window.SkillBridgeStore.getCurrentCompany();
      const state = window.SkillBridgeStore.getState();
      const compName = (comp && comp.name) || 'ABC Tech';

      const compOpps = (state.opportunities || []).filter(o => o.companyId === comp.id || o.companyName === compName);
      const oppIds = new Set(compOpps.map(o => o.id));
      const compApps = (state.applications || []).filter(a => oppIds.has(a.opportunityId) || a.companyId === comp.id);

      const container = document.getElementById('applicants-container');
      container.innerHTML = '';

      if (compApps.length === 0) {
        container.innerHTML = `
          <div class="sb-card p-12 text-center space-y-3">
            <span class="material-symbols-outlined text-4xl text-slate-400">groups</span>
            <h3 class="text-base font-bold text-slate-900">No Applicants in Pipeline</h3>
            <p class="text-xs text-slate-500 max-w-sm mx-auto">
              Candidates who meet your required skill thresholds will appear here once they apply and pass screening.
            </p>
          </div>
        `;
        return;
      }

      compApps.forEach(app => {
        const card = document.createElement('div');
        card.className = 'sb-card p-6 flex flex-col md:flex-row md:items-center justify-between gap-4 sb-card-interactive';

        let statusBadge = '';
        if (app.status === 'Shortlisted') statusBadge = '<span class="sb-badge sb-badge-emerald">Shortlisted</span>';
        else if (app.status === 'Selected') statusBadge = '<span class="sb-badge sb-badge-blue">Selected / Offer Extended</span>';
        else statusBadge = `<span class="sb-badge sb-badge-amber">${app.status}</span>`;

        card.innerHTML = `
          <div class="space-y-1.5">
            <div class="flex items-center gap-2 flex-wrap">
              <h3 class="text-base font-bold text-slate-900">${app.studentName}</h3>
              <span class="sb-badge sb-badge-muted text-[10px]">${app.college} · ${app.department || 'CSE'}</span>
              ${statusBadge}
            </div>
            <p class="text-xs text-slate-600">Position Applied: <b class="text-slate-800">${app.opportunityTitle}</b> · Applied: ${app.appliedDate}</p>
            <div class="flex items-center gap-3 text-[11px] text-slate-500 pt-1 flex-wrap">
              <span>Skill Match: <b class="text-emerald-700 font-semibold">${app.matchScore}%</b></span>
              <span>·</span>
              <span>Screening Score: <b class="text-blue-700 font-semibold">${app.screeningScore !== null ? `${app.screeningScore}/20` : 'Pending'}</b></span>
              <span>·</span>
              <span class="text-slate-600">Resume: <b>Rahul_Sharma_Resume.pdf</b></span>
            </div>
          </div>

          <div class="shrink-0 flex items-center gap-2">
            <button onclick="setStatus('${app.id}', 'Shortlisted')" class="sb-btn sb-btn-secondary text-xs">Shortlist</button>
            <button onclick="setStatus('${app.id}', 'Selected')" class="sb-btn sb-btn-primary text-xs">Offer Candidate</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function setStatus(appId, status) {
      window.SkillBridgeStore.updateApplicationStatus(appId, status);
      alert(`Candidate status updated to: ${status}`);
      renderApplicants();
    }

    window.addEventListener('skillbridge-state-change', renderApplicants);
    document.addEventListener('DOMContentLoaded', renderApplicants);
  </script>
</body>
</html>
