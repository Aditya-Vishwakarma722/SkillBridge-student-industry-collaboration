<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offers &amp; Shortlists — SkillBridge</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/design-system.css">
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-900">

  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 py-8 w-full space-y-6">

    <!-- Header Banner -->
    <div class="sb-card p-6 sm:p-8 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6 border-slate-200">
      <div class="space-y-1.5">
        <div class="flex items-center gap-2">
          <span class="sb-badge sb-badge-emerald">Offer Rollout</span>
          <span class="sb-badge sb-badge-blue">Final Selection</span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">Released Offers &amp; Letters</h1>
        <p class="text-xs sm:text-sm text-slate-600 max-w-xl">
          Track candidates who passed proctored screening and received corporate offers from ABC Tech Corp.
        </p>
      </div>

      <div class="flex items-center gap-2.5">
        <a href="shortlisted.html" class="sb-btn sb-btn-primary">
          <span class="material-symbols-outlined text-[16px]">verified</span>
          <span>Shortlisted Pool</span>
        </a>
        <a href="index.html" class="sb-btn sb-btn-secondary">
          <span class="material-symbols-outlined text-[16px]">space_dashboard</span>
          <span>Console</span>
        </a>
      </div>
    </div>

    <!-- Offers List -->
    <div class="sb-card p-6 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
          <span class="material-symbols-outlined text-slate-700">mail</span>
          <span>Official Corporate Offer Letters</span>
        </h2>
        <span class="sb-badge sb-badge-emerald" id="offers-count">Loading...</span>
      </div>

      <div id="offers-list" class="space-y-3">
        <!-- Populated via script -->
      </div>
    </div>

  </main>

  <script src="../js/store.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    function renderOffers() {
      if (!window.SkillBridgeStore) return;
      const state = window.SkillBridgeStore.getState();
      const apps = (state.applications || []).filter(a => a.status === 'Selected' || a.status === 'Shortlisted');
      const container = document.getElementById('offers-list');
      container.innerHTML = '';

      document.getElementById('offers-count').innerText = `${apps.length} Candidates`;

      if (apps.length === 0) {
        container.innerHTML = `
          <div class="p-8 text-center space-y-2">
            <span class="material-symbols-outlined text-slate-400 text-3xl">mail_outline</span>
            <p class="text-xs text-slate-500">No offers released yet. Review shortlisted candidates to send offers.</p>
          </div>
        `;
        return;
      }

      apps.forEach(app => {
        const item = document.createElement('div');
        item.className = 'sb-card-elevated p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3';
        item.innerHTML = `
          <div>
            <div class="flex items-center gap-2">
              <h3 class="text-sm font-bold text-slate-900">${app.studentName}</h3>
              <span class="sb-badge sb-badge-emerald text-[10px]">Offer Dispatched</span>
            </div>
            <p class="text-xs text-slate-500 mt-0.5">${app.opportunityTitle} &bull; ${app.college || 'Apex Institute of Technology'}</p>
          </div>

          <div class="flex items-center gap-3">
            <div class="text-right text-xs">
              <span class="text-slate-900 font-mono font-bold">Match: ${app.matchScore}%</span>
              <p class="text-[11px] text-emerald-700 font-semibold">Screening: ${app.screeningScore || 18}/20</p>
            </div>
            <button onclick="alert('Offer letter PDF generated and dispatched to ${app.studentName} via verifiable credential protocol.')" class="sb-btn sb-btn-primary text-xs px-3 py-1.5">
              <span class="material-symbols-outlined text-[14px]">download</span>
              <span>Letter</span>
            </button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    window.addEventListener('skillbridge-state-change', renderOffers);
    window.addEventListener('skillbridge:update', renderOffers);
    document.addEventListener('DOMContentLoaded', renderOffers);
  </script>
</body>
</html>
