<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Opportunities — SkillBridge</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/design-system.css">
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-900">

  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 py-8 w-full space-y-6">

    <!-- Header Banner -->
    <div class="sb-card p-6 sm:p-8 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6 border-slate-200">
      <div class="space-y-1.5">
        <div class="flex items-center gap-2">
          <span class="sb-badge sb-badge-emerald">Postings Directory</span>
          <span class="sb-badge sb-badge-blue">Threshold Gating</span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">Manage Position Postings</h1>
        <p class="text-xs sm:text-sm text-slate-600 max-w-xl">
          Publish engineering roles with standardized 1,000-point skill score prerequisites. Prevent unqualified applications automatically.
        </p>
      </div>

      <button onclick="openCreateOppModal()" class="sb-btn sb-btn-primary">
        <span class="material-symbols-outlined text-[16px]">add_circle</span>
        <span>Create Position</span>
      </button>
    </div>

    <!-- Listings Container -->
    <div id="company-opps-container" class="space-y-4">
      <!-- Populated via script -->
    </div>

  </main>

  <!-- Create Position Modal -->
  <div id="create-opp-modal" class="sb-modal-backdrop hidden">
    <div class="sb-modal-content p-6 sm:p-8 space-y-5 max-w-lg">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h3 class="text-base font-bold text-slate-900">Create Engineering Position</h3>
        <button onclick="closeCreateOppModal()" class="text-slate-400 hover:text-slate-700">
          <span class="material-symbols-outlined text-lg">close</span>
        </button>
      </div>

      <form id="create-opp-form" class="space-y-4 text-xs">
        <div>
          <label class="block text-slate-700 mb-1 font-medium">Position Title</label>
          <input type="text" id="opp-new-title" class="sb-input" placeholder="e.g. Distributed Systems Engineer" required>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-700 mb-1 font-medium">Position Type</label>
            <select id="opp-new-type" class="sb-input">
              <option value="Internship">Internship</option>
              <option value="Job">Full-Time Job</option>
              <option value="Workshop">Workshop</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-700 mb-1 font-medium">Location</label>
            <input type="text" id="opp-new-location" class="sb-input" placeholder="e.g. Remote / Hyderabad" required>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-700 mb-1 font-medium">Stipend / CTC</label>
            <input type="text" id="opp-new-stipend" class="sb-input" placeholder="e.g. ₹30,000 / mo or 9.0 LPA" required>
          </div>
          <div>
            <label class="block text-slate-700 mb-1 font-medium">Openings Count</label>
            <input type="number" id="opp-new-openings" class="sb-input" value="3" required>
          </div>
        </div>

        <div>
          <label class="block text-slate-700 mb-1 font-medium">Job Description</label>
          <textarea id="opp-new-desc" rows="3" class="sb-input" placeholder="Responsibilities and technology stack details..." required></textarea>
        </div>

        <div class="space-y-2 pt-2 border-t border-slate-100">
          <label class="block text-slate-800 font-bold">Required Skill Thresholds (out of 1000):</label>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-slate-600 mb-0.5">Primary Skill 1</label>
              <div class="flex gap-2">
                <input type="text" id="skill-name-1" class="sb-input" value="Java" placeholder="Skill Name">
                <input type="number" id="skill-score-1" class="sb-input w-24" value="700" placeholder="Min">
              </div>
            </div>
            <div>
              <label class="block text-slate-600 mb-0.5">Primary Skill 2</label>
              <div class="flex gap-2">
                <input type="text" id="skill-name-2" class="sb-input" value="SQL" placeholder="Skill Name">
                <input type="number" id="skill-score-2" class="sb-input w-24" value="600" placeholder="Min">
              </div>
            </div>
          </div>
        </div>

        <div class="pt-3 border-t border-slate-100 flex justify-end gap-2">
          <button type="button" onclick="closeCreateOppModal()" class="sb-btn sb-btn-secondary">Cancel</button>
          <button type="submit" class="sb-btn sb-btn-primary">Publish Position</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/store.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    function renderCompanyOpportunities() {
      if (!window.SkillBridgeStore) return;
      const comp = window.SkillBridgeStore.getCurrentCompany();
      const state = window.SkillBridgeStore.getState();
      const compName = (comp && comp.name) || 'ABC Tech';

      const compOpps = (state.opportunities || []).filter(o => o.companyId === comp.id || o.companyName === compName);
      const container = document.getElementById('company-opps-container');
      container.innerHTML = '';

      if (compOpps.length === 0) {
        container.innerHTML = `
          <div class="sb-card p-12 text-center space-y-3">
            <span class="material-symbols-outlined text-4xl text-slate-400">post_add</span>
            <h3 class="text-base font-bold text-slate-900">No Positions Published Yet</h3>
            <p class="text-xs text-slate-500 max-w-sm mx-auto">Create and publish engineering positions with standardized minimum score thresholds.</p>
            <button onclick="openCreateOppModal()" class="sb-btn sb-btn-primary">Create Your First Listing</button>
          </div>
        `;
        return;
      }

      compOpps.forEach(opp => {
        const card = document.createElement('div');
        card.className = 'sb-card p-6 space-y-4 sb-card-interactive';

        let reqSkillsHtml = '';
        for (const [s, reqScore] of Object.entries(opp.requiredSkills || {})) {
          reqSkillsHtml += `
            <span class="sb-badge sb-badge-blue text-[10px]">
              ${s}: ${reqScore} / 1000
            </span>
          `;
        }

        card.innerHTML = `
          <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
            <div>
              <div class="flex items-center gap-2 mb-1 flex-wrap">
                <h3 class="text-base font-bold text-slate-900">${opp.title}</h3>
                <span class="sb-badge sb-badge-muted">${opp.type}</span>
                <span class="sb-badge sb-badge-emerald">${opp.openings} Openings</span>
              </div>
              <p class="text-xs text-slate-500">${opp.location} · Stipend: <b class="text-slate-700">${opp.stipend}</b> · Deadline: ${opp.deadline}</p>
            </div>
            <button onclick="deleteOpp('${opp.id}')" class="text-slate-400 hover:text-rose-600 self-start p-1 transition" title="Delete Listing">
              <span class="material-symbols-outlined text-lg">delete</span>
            </button>
          </div>

          <p class="text-xs text-slate-600 leading-relaxed">${opp.description}</p>

          <div class="pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2 text-xs">
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="text-[11px] text-slate-500 font-medium">Gated Thresholds:</span>
              ${reqSkillsHtml}
            </div>
            <a href="applicants.html" class="text-blue-600 hover:text-blue-700 hover:underline font-semibold">View Applicants &rarr;</a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openCreateOppModal() {
      document.getElementById('create-opp-modal').classList.remove('hidden');
    }

    function closeCreateOppModal() {
      document.getElementById('create-opp-modal').classList.add('hidden');
    }

    function deleteOpp(oppId) {
      if (confirm('Delete this position posting?')) {
        window.SkillBridgeStore.deleteOpportunity(oppId);
        renderCompanyOpportunities();
      }
    }

    document.getElementById('create-opp-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('opp-new-title').value;
      const type = document.getElementById('opp-new-type').value;
      const location = document.getElementById('opp-new-location').value;
      const stipend = document.getElementById('opp-new-stipend').value;
      const openings = document.getElementById('opp-new-openings').value;
      const description = document.getElementById('opp-new-desc').value;

      const s1 = document.getElementById('skill-name-1').value.trim();
      const sc1 = parseInt(document.getElementById('skill-score-1').value, 10) || 700;
      const s2 = document.getElementById('skill-name-2').value.trim();
      const sc2 = parseInt(document.getElementById('skill-score-2').value, 10) || 600;

      const requiredSkills = {};
      if (s1) requiredSkills[s1] = sc1;
      if (s2) requiredSkills[s2] = sc2;

      window.SkillBridgeStore.createOpportunity({
        title, type, location, stipend, openings, description, requiredSkills
      });

      closeCreateOppModal();
      document.getElementById('create-opp-form').reset();
      renderCompanyOpportunities();
    });

    window.addEventListener('skillbridge-state-change', renderCompanyOpportunities);
    document.addEventListener('DOMContentLoaded', renderCompanyOpportunities);
  </script>
</body>
</html>
