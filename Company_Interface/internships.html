<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internship Postings — SkillBridge</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/design-system.css">
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-900">

  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 py-8 w-full space-y-6">

    <!-- Header Banner -->
    <div class="sb-card p-6 sm:p-8 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6 border-slate-200">
      <div class="space-y-1.5">
        <div class="flex items-center gap-2">
          <span class="sb-badge sb-badge-emerald">Campus Internship Drive</span>
          <span class="sb-badge sb-badge-blue">Student Pipeline</span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">Active Internship Programs</h1>
        <p class="text-xs sm:text-sm text-slate-600 max-w-xl">
          Discover students with verified skill vectors and proctored screening assessment results.
        </p>
      </div>

      <div class="flex items-center gap-2.5">
        <a href="opportunities.html" class="sb-btn sb-btn-primary">
          <span class="material-symbols-outlined text-[16px]">add_circle</span>
          <span>Post Internship</span>
        </a>
        <a href="index.html" class="sb-btn sb-btn-secondary">
          <span class="material-symbols-outlined text-[16px]">space_dashboard</span>
          <span>Console</span>
        </a>
      </div>
    </div>

    <!-- Internships Grid -->
    <div id="internships-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Populated via script -->
    </div>

  </main>

  <script src="../js/store.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    function renderInternships() {
      if (!window.SkillBridgeStore) return;
      const state = window.SkillBridgeStore.getState();
      const opps = (state.opportunities || []).filter(o => o.type === 'Internship');
      const container = document.getElementById('internships-grid');
      container.innerHTML = '';

      if (opps.length === 0) {
        container.innerHTML = `
          <div class="col-span-full sb-card p-12 text-center space-y-3">
            <span class="material-symbols-outlined text-slate-400 text-4xl">school</span>
            <div class="text-sm text-slate-600 font-medium">No active internship listings found.</div>
            <a href="opportunities.html" class="sb-btn sb-btn-primary inline-flex mt-2">Post Internship</a>
          </div>
        `;
        return;
      }

      opps.forEach(internship => {
        const skillsObj = internship.requiredSkills || {};
        const skillBadges = Object.entries(skillsObj).map(([k, v]) => 
          `<span class="sb-badge sb-badge-blue text-[10px]">${k} &ge; ${v}</span>`
        ).join(' ');

        const card = document.createElement('div');
        card.className = 'sb-card p-6 space-y-4 sb-card-interactive flex flex-col justify-between';
        card.innerHTML = `
          <div class="space-y-3">
            <div class="flex items-start justify-between gap-3">
              <div>
                <h3 class="text-base font-bold text-slate-900">${internship.title}</h3>
                <p class="text-xs text-slate-500">${internship.location} &bull; ${internship.stipend}</p>
              </div>
              <span class="sb-badge sb-badge-emerald">Active</span>
            </div>

            <p class="text-xs text-slate-600 leading-relaxed">${internship.description}</p>

            <div class="space-y-1.5 pt-2 border-t border-slate-100">
              <span class="text-[11px] text-slate-500 font-medium">Required Skill Vector Gate:</span>
              <div class="flex flex-wrap gap-1.5 pt-1">
                ${skillBadges}
              </div>
            </div>
          </div>

          <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs">
            <span class="text-slate-500">${internship.openings} Openings</span>
            <a href="applicants.html" class="sb-btn sb-btn-secondary text-xs px-2.5 py-1">
              <span>View Candidates</span>
              <span class="material-symbols-outlined text-[14px]">arrow_forward</span>
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    window.addEventListener('skillbridge-state-change', renderInternships);
    window.addEventListener('skillbridge:update', renderInternships);
    document.addEventListener('DOMContentLoaded', renderInternships);
  </script>
</body>
</html>
