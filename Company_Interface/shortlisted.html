<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shortlisted Candidates — SkillBridge</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/design-system.css">
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-900">

  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 py-8 w-full space-y-6">

    <!-- Header Banner -->
    <div class="sb-card p-6 sm:p-8 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6 border-slate-200">
      <div class="space-y-1.5">
        <div class="flex items-center gap-2">
          <span class="sb-badge sb-badge-emerald">Qualified Finalists</span>
          <span class="sb-badge sb-badge-blue">Screening Passed (&ge;15/20)</span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">Shortlisted Candidates</h1>
        <p class="text-xs sm:text-sm text-slate-600 max-w-xl">
          Candidates who cleared technical skill vectors and proctored evaluations, ready for interview and offer.
        </p>
      </div>

      <a href="applicants.html" class="sb-btn sb-btn-secondary">
        <span class="material-symbols-outlined text-[16px]">arrow_back</span>
        <span>All Applicants</span>
      </a>
    </div>

    <div id="shortlisted-container" class="space-y-4">
      <!-- Populated via script -->
    </div>

  </main>

  <script src="../js/store.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    function renderShortlisted() {
      if (!window.SkillBridgeStore) return;
      const comp = window.SkillBridgeStore.getCurrentCompany();
      const state = window.SkillBridgeStore.getState();
      const compName = (comp && comp.name) || 'ABC Tech';

      const compOpps = (state.opportunities || []).filter(o => o.companyId === comp.id || o.companyName === compName);
      const oppIds = new Set(compOpps.map(o => o.id));
      const shortlisted = (state.applications || []).filter(a => (oppIds.has(a.opportunityId) || a.companyId === comp.id) && (a.status === 'Shortlisted' || a.status === 'Selected'));

      const container = document.getElementById('shortlisted-container');
      container.innerHTML = '';

      if (shortlisted.length === 0) {
        container.innerHTML = `
          <div class="sb-card p-12 text-center space-y-3">
            <span class="material-symbols-outlined text-4xl text-slate-400">verified</span>
            <h3 class="text-base font-bold text-slate-900">No Shortlisted Candidates Yet</h3>
            <p class="text-xs text-slate-500 max-w-sm mx-auto">
              Candidates who clear the proctored 20-question screening test with score ≥ 15 will appear here.
            </p>
          </div>
        `;
        return;
      }

      shortlisted.forEach(app => {
        const card = document.createElement('div');
        card.className = 'sb-card p-6 flex flex-col md:flex-row md:items-center justify-between gap-4 sb-card-interactive';
        card.innerHTML = `
          <div class="space-y-1.5">
            <div class="flex items-center gap-2 flex-wrap">
              <h3 class="text-base font-bold text-slate-900">${app.studentName}</h3>
              <span class="sb-badge sb-badge-emerald">Verified Finalist</span>
            </div>
            <p class="text-xs text-slate-600">${app.college} · Applied for <b class="text-slate-800">${app.opportunityTitle}</b></p>
            <div class="flex items-center gap-3 text-[11px] text-slate-500 pt-1">
              <span>Skill Match: <b class="text-emerald-700 font-semibold">${app.matchScore}%</b></span>
              <span>·</span>
              <span>Screening Score: <b class="text-blue-700 font-semibold">${app.screeningScore || 18} / 20</b></span>
            </div>
          </div>
          <div class="shrink-0 flex items-center gap-2">
            <button onclick="extendOffer('${app.id}')" class="sb-btn sb-btn-primary text-xs">
              <span class="material-symbols-outlined text-xs">mail</span>
              <span>Send Offer Letter</span>
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function extendOffer(appId) {
      window.SkillBridgeStore.updateApplicationStatus(appId, 'Selected');
      alert('Formal offer extended to candidate. Status updated to "Selected / Offer Extended".');
      renderShortlisted();
    }

    window.addEventListener('skillbridge-state-change', renderShortlisted);
    document.addEventListener('DOMContentLoaded', renderShortlisted);
  </script>
</body>
</html>
