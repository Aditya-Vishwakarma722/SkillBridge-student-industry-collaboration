<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Applications — SkillBridge</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          primary: "#f2ca50",
          "primary-container": "#d4af37",
          surface: "#0f131f",
          "surface-container": "#1b1f2c"
        }
      }
    }
  };
</script>
<style>
  body {
    background: #0f131f;
    color: #dfe2f3;
    font-family: 'Inter', sans-serif;
  }
  .glass-pane {
    background-color: rgba(22, 27, 46, 0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
</style>
</head>
<body class="min-h-screen bg-[#0f131f] text-[#dfe2f3] flex flex-col">

<main class="flex-1 p-4 md:p-8 max-w-[1200px] mx-auto w-full space-y-6">

  <!-- Title Header -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-white/10 pb-4">
    <div>
      <h1 class="text-2xl font-bold font-serif text-amber-400">My Applications & Screening Pipeline</h1>
      <p class="text-xs text-zinc-400">Track application statuses, screening test scores, and recruitment progress in real time.</p>
    </div>
    <a href="../Opportunity_Interface/index.html" class="px-4 py-2 bg-amber-500 text-black font-bold rounded-xl text-xs flex items-center gap-1.5 hover:bg-amber-400 transition-all shadow-md self-start sm:self-auto">
      <span class="material-symbols-outlined text-base">search</span>
      <span>Browse Opportunities</span>
    </a>
  </div>

  <!-- Applications Table / Cards -->
  <div class="space-y-4">
    <div id="applications-container" class="space-y-4">
      <!-- Populated via store.js -->
    </div>
  </div>

</main>

<!-- Screening Test Interactive Modal -->
<div id="screening-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/80 backdrop-blur-md">
  <div class="glass-pane w-full max-w-2xl rounded-2xl p-6 relative bg-[#161B2E] border border-amber-500/30 space-y-4 max-h-[90vh] overflow-y-auto">
    <button onclick="toggleScreeningModal(false)" class="absolute top-4 right-4 text-zinc-400 hover:text-white">
      <span class="material-symbols-outlined">close</span>
    </button>

    <div class="flex items-center justify-between border-b border-white/10 pb-3">
      <div>
        <span class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 text-[10px] font-bold uppercase tracking-wider">Company Screening Stage</span>
        <h3 id="screening-opp-title" class="font-bold text-lg text-white">Java Backend Intern Screening</h3>
        <p id="screening-comp-name" class="text-xs text-zinc-400">ABC Tech</p>
      </div>

      <!-- Real-Time Camera Preview Box -->
      <div class="relative w-24 h-16 rounded-lg bg-black border border-amber-400/40 overflow-hidden flex items-center justify-center">
        <video id="screening-cam" class="w-full h-full object-cover" autoplay playsinline muted></video>
        <span id="cam-fallback" class="material-symbols-outlined text-zinc-500 text-xl">videocam_off</span>
        <div class="absolute bottom-1 right-1 flex items-center gap-1 px-1 rounded bg-black/70 text-[9px] text-emerald-400 font-bold">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> REC
        </div>
      </div>
    </div>

    <!-- Screening Test Question Container -->
    <div id="screening-body" class="space-y-4">
      <!-- Generated via JS -->
    </div>

    <div id="screening-footer" class="flex justify-between items-center pt-3 border-t border-white/10 text-xs">
      <div class="text-zinc-400 font-medium">Passing Threshold: <strong class="text-amber-400">15 / 20 Questions (75%)</strong></div>
      <button onclick="submitScreeningAnswers()" class="px-5 py-2.5 bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 text-black font-bold rounded-xl shadow-lg transition-all">
        Submit Screening Assessment
      </button>
    </div>
  </div>
</div>

<script src="../js/store.js"></script>
<script src="../js/nav.js"></script>
<script>
  let activeAppIdForScreening = null;

  function renderApplications() {
    if (!window.SkillBridgeStore) return;

    const student = window.SkillBridgeStore.getCurrentStudent();
    const state = window.SkillBridgeStore.getState();
    const userApps = (state.applications || []).filter(a => a.studentId === student.id);

    const container = document.getElementById('applications-container');
    container.innerHTML = '';

    if (userApps.length === 0) {
      container.innerHTML = `
        <div class="text-center py-12 glass-pane rounded-2xl">
          <span class="material-symbols-outlined text-4xl text-zinc-500 mb-2">assignment_late</span>
          <h3 class="text-base font-bold text-white mb-1">No Applications Submitted Yet</h3>
          <p class="text-xs text-zinc-400 mb-4">Discover verified opportunities matching your skill vector and apply in one click.</p>
          <a href="../Opportunity_Interface/index.html" class="px-4 py-2 bg-amber-500 text-black font-bold rounded-xl text-xs">Browse Opportunities</a>
        </div>
      `;
      return;
    }

    userApps.forEach(app => {
      const statusColors = {
        Applied: 'bg-zinc-500/20 text-zinc-300 border-zinc-500/30',
        'Under Review': 'bg-amber-500/20 text-amber-300 border-amber-500/30',
        Screening: 'bg-indigo-500/20 text-indigo-300 border-indigo-500/30',
        Shortlisted: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30',
        Selected: 'bg-emerald-400 text-black font-bold',
        Rejected: 'bg-rose-500/20 text-rose-300 border-rose-500/30'
      }[app.status] || 'bg-amber-500/20 text-amber-300';

      let actionBtn = '';
      if (app.status === 'Screening' && (app.screeningScore === null || app.screeningScore === undefined)) {
        actionBtn = `
          <button onclick="startScreeningModal('${app.id}')" class="px-4 py-2 bg-gradient-to-r from-indigo-500 to-indigo-600 hover:from-indigo-400 hover:to-indigo-500 text-white font-bold rounded-xl text-xs shadow-md flex items-center gap-1.5 animate-pulse">
            <span class="material-symbols-outlined text-base">videocam</span>
            <span>Take Company Screening Test (20 Qs)</span>
          </button>
        `;
      } else if (app.screeningScore !== null && app.screeningScore !== undefined) {
        actionBtn = `
          <div class="text-xs text-zinc-300 flex items-center gap-1 bg-black/40 px-3 py-1.5 rounded-xl border border-white/10">
            <span class="material-symbols-outlined text-amber-400 text-base">fact_check</span>
            <span>Screening Score: <strong class="text-amber-300">${app.screeningScore} / 20</strong></span>
          </div>
        `;
      }

      container.innerHTML += `
        <div class="glass-pane rounded-2xl p-5 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 border border-white/10 hover:border-amber-500/30 transition-all">
          <div class="space-y-1">
            <div class="flex items-center gap-2">
              <h3 class="text-base font-bold text-white">${app.opportunityTitle}</h3>
              <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold border ${statusColors}">${app.status}</span>
            </div>
            <p class="text-xs text-amber-400 font-medium">${app.companyName} • Applied on ${app.appliedDate}</p>
            <div class="flex items-center gap-3 text-xs text-zinc-400 pt-1">
              <span>Skill Qualification Score: <strong class="text-emerald-400 font-bold">${app.matchScore}% Match</strong></span>
              <span>•</span>
              <span>College: <strong class="text-zinc-200">${app.college || 'Aditya University'}</strong></span>
            </div>
          </div>

          <div class="shrink-0 flex items-center gap-3 w-full md:w-auto justify-end border-t md:border-t-0 border-white/10 pt-3 md:pt-0">
            ${actionBtn}
          </div>
        </div>
      `;
    });
  }

  function startScreeningModal(appId) {
    activeAppIdForScreening = appId;
    const state = window.SkillBridgeStore.getState();
    const app = state.applications.find(a => a.id === appId);

    if (!app) return;

    document.getElementById('screening-opp-title').innerText = `${app.opportunityTitle} Screening Test`;
    document.getElementById('screening-comp-name').innerText = `${app.companyName} Recruitment Session`;

    // Try starting camera preview
    const video = document.getElementById('screening-cam');
    const fallback = document.getElementById('cam-fallback');
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
        video.srcObject = stream;
        video.classList.remove('hidden');
        fallback.classList.add('hidden');
      }).catch(err => {
        console.warn('Camera preview unavailable:', err);
      });
    }

    // Build 5 sample questions out of 20
    const body = document.getElementById('screening-body');
    body.innerHTML = `
      <div class="bg-amber-500/10 border border-amber-500/20 p-3 rounded-xl text-xs text-amber-300">
        ℹ️ Real-time face camera monitoring active. Answer the 20 role-specific screening questions. Score ≥ 15 to automatically qualify for candidate shortlisting.
      </div>

      <div class="space-y-4 text-xs">
        <div class="bg-black/40 p-4 rounded-xl border border-white/10 space-y-2">
          <p class="font-bold text-white">Q1. What is the time complexity of looking up a key in a well-balanced Java HashMap?</p>
          <div class="space-y-1 text-zinc-300">
            <label class="flex items-center gap-2 p-1.5 hover:bg-white/5 rounded cursor-pointer"><input type="radio" name="q1" value="1" checked> O(1) average time</label>
            <label class="flex items-center gap-2 p-1.5 hover:bg-white/5 rounded cursor-pointer"><input type="radio" name="q1" value="0"> O(N) linear time</label>
          </div>
        </div>

        <div class="bg-black/40 p-4 rounded-xl border border-white/10 space-y-2">
          <p class="font-bold text-white">Q2. In Spring Boot, which annotation is used to auto-wire bean dependencies into constructor or fields?</p>
          <div class="space-y-1 text-zinc-300">
            <label class="flex items-center gap-2 p-1.5 hover:bg-white/5 rounded cursor-pointer"><input type="radio" name="q2" value="1" checked> @Autowired</label>
            <label class="flex items-center gap-2 p-1.5 hover:bg-white/5 rounded cursor-pointer"><input type="radio" name="q2" value="0"> @InjectBean</label>
          </div>
        </div>

        <div class="bg-black/40 p-4 rounded-xl border border-white/10 space-y-2">
          <p class="font-bold text-white">Q3. Which SQL clause is used to filter aggregated group results produced by GROUP BY?</p>
          <div class="space-y-1 text-zinc-300">
            <label class="flex items-center gap-2 p-1.5 hover:bg-white/5 rounded cursor-pointer"><input type="radio" name="q3" value="1" checked> HAVING</label>
            <label class="flex items-center gap-2 p-1.5 hover:bg-white/5 rounded cursor-pointer"><input type="radio" name="q3" value="0"> WHERE</label>
          </div>
        </div>
      </div>
    `;

    const modal = document.getElementById('screening-modal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
  }

  function submitScreeningAnswers() {
    if (!activeAppIdForScreening || !window.SkillBridgeStore) return;
    
    // Simulate high passing screening score: 17/20
    const simulatedScore = 17;
    window.SkillBridgeStore.submitScreeningTest(activeAppIdForScreening, simulatedScore);

    toggleScreeningModal(false);
    renderApplications();
  }

  function toggleScreeningModal(show) {
    const modal = document.getElementById('screening-modal');
    if (show) {
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    } else {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      
      // Stop video camera stream if active
      const video = document.getElementById('screening-cam');
      if (video && video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderApplications();
    window.addEventListener('skillbridge-state-change', renderApplications);
  });
</script>
</body>
</html>
