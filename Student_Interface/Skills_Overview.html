<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills Overview & Gap Analysis — SkillBridge</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          primary: "#f2ca50",
          "primary-container": "#d4af37",
          surface: "#0f131f",
          "surface-container": "#1b1f2c"
        }
      }
    }
  };
</script>
<style>
  body {
    background: #0f131f;
    color: #dfe2f3;
    font-family: 'Inter', sans-serif;
  }
  .glass-pane {
    background-color: rgba(22, 27, 46, 0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
</style>
</head>
<body class="min-h-screen bg-[#0f131f] text-[#dfe2f3] flex flex-col">

<main class="flex-1 p-4 md:p-8 max-w-[1200px] mx-auto w-full space-y-6">

  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-white/10 pb-4">
    <div>
      <h1 class="text-2xl font-bold font-serif text-amber-400">My Skills & Qualification Overview</h1>
      <p class="text-xs text-zinc-400">Standardized skill assessment scores (0–100) and readiness status.</p>
    </div>
    <a href="../Assessment_Interface/index.html" class="px-4 py-2 bg-amber-500 text-black font-bold rounded-xl text-xs flex items-center gap-1.5 hover:bg-amber-400 transition-all shadow-md">
      <span class="material-symbols-outlined text-base">quiz</span>
      <span>Take Diagnostic Assessment</span>
    </a>
  </div>

  <!-- Skill Scores Table & Cards -->
  <section class="glass-pane rounded-2xl p-6 space-y-4">
    <div class="overflow-x-auto">
      <table class="w-full text-left text-xs text-zinc-300">
        <thead class="bg-black/40 text-amber-300 uppercase text-[10px] tracking-wider border-b border-white/10">
          <tr>
            <th class="py-3 px-4">Skill Domain</th>
            <th class="py-3 px-4">Assessed Score</th>
            <th class="py-3 px-4">Readiness Status</th>
            <th class="py-3 px-4">Progress Vector</th>
            <th class="py-3 px-4">Action</th>
          </tr>
        </thead>
        <tbody id="skills-overview-table" class="divide-y divide-white/5">
          <!-- Populated via store.js -->
        </tbody>
      </table>
    </div>
  </section>

</main>

<script src="../js/store.js"></script>
<script src="../js/nav.js"></script>
<script>
  function renderSkillsOverview() {
    if (!window.SkillBridgeStore) return;

    const student = window.SkillBridgeStore.getCurrentStudent();
    const table = document.getElementById('skills-overview-table');
    table.innerHTML = '';

    if (student.skills) {
      for (const [skill, score] of Object.entries(student.skills)) {
        let status = 'Developing';
        let badgeColor = 'bg-rose-500/20 text-rose-300 border-rose-500/30';
        let barColor = 'bg-rose-400';

        if (score >= 80) {
          status = 'Strong (Industry Ready)';
          badgeColor = 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30';
          barColor = 'bg-emerald-400';
        } else if (score >= 60) {
          status = 'Good Qualification';
          badgeColor = 'bg-amber-500/20 text-amber-300 border-amber-500/30';
          barColor = 'bg-amber-400';
        }

        table.innerHTML += `
          <tr class="hover:bg-white/5 transition-colors">
            <td class="py-3 px-4 font-bold text-white flex items-center gap-2">
              <span class="material-symbols-outlined text-amber-400 text-base">code</span>
              <span>${skill}</span>
            </td>
            <td class="py-3 px-4 font-bold text-amber-300 text-sm">${score} / 100</td>
            <td class="py-3 px-4">
              <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold border ${badgeColor}">${status}</span>
            </td>
            <td class="py-3 px-4">
              <div class="w-32 bg-white/10 h-2 rounded-full overflow-hidden">
                <div class="h-full ${barColor}" style="width: ${score}%"></div>
              </div>
            </td>
            <td class="py-3 px-4">
              <a href="../Assessment_Interface/index.html?skill=${encodeURIComponent(skill)}" class="px-3 py-1 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 rounded-lg text-[11px] font-bold transition-all inline-flex items-center gap-1">
                <span class="material-symbols-outlined text-xs">restart_alt</span> Re-assess
              </a>
            </td>
          </tr>
        `;
      }
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderSkillsOverview();
    window.addEventListener('skillbridge-state-change', renderSkillsOverview);
  });
</script>
</body>
</html>
