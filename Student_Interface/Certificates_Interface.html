<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifiable Credentials — SkillBridge</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/design-system.css">
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-900">

  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 py-8 w-full space-y-6">

    <!-- Header Banner -->
    <div class="sb-card p-6 sm:p-8 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6 border-slate-200">
      <div class="space-y-1.5">
        <div class="flex items-center gap-2">
          <span class="sb-badge sb-badge-amber">Credentials</span>
          <span class="sb-badge sb-badge-blue">Verified Portfolio</span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">Certificates &amp; Credentials</h1>
        <p class="text-xs sm:text-sm text-slate-600 max-w-xl">
          Authorized certificates with immutable verification IDs. Shared directly with corporate hiring teams.
        </p>
      </div>

      <button onclick="openAddCertModal()" class="sb-btn sb-btn-primary">
        <span class="material-symbols-outlined text-[16px]">add_circle</span>
        <span>Add Certificate</span>
      </button>
    </div>

    <!-- Certificates Grid -->
    <div id="certs-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Populated via script -->
    </div>

  </main>

  <!-- Add Certificate Modal -->
  <div id="add-cert-modal" class="sb-modal-backdrop hidden">
    <div class="sb-modal-content p-6 sm:p-8 space-y-5 max-w-md">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h3 class="text-base font-bold text-slate-900">Add Verifiable Certificate</h3>
        <button onclick="closeAddCertModal()" class="text-slate-400 hover:text-slate-700">
          <span class="material-symbols-outlined text-lg">close</span>
        </button>
      </div>

      <form id="add-cert-form" class="space-y-4 text-xs">
        <div>
          <label class="block text-slate-700 mb-1 font-medium">Certificate Title</label>
          <input type="text" id="cert-name" class="sb-input" placeholder="e.g. AWS Certified Cloud Practitioner" required>
        </div>

        <div>
          <label class="block text-slate-700 mb-1 font-medium">Issuing Organization</label>
          <input type="text" id="cert-issuer" class="sb-input" placeholder="e.g. Amazon Web Services (AWS)" required>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-700 mb-1 font-medium">Issue Date</label>
            <input type="text" id="cert-date" class="sb-input" placeholder="e.g. Jan 2026" required>
          </div>
          <div>
            <label class="block text-slate-700 mb-1 font-medium">Credential ID</label>
            <input type="text" id="cert-id" class="sb-input" placeholder="e.g. AWS-8921-X" required>
          </div>
        </div>

        <div>
          <label class="block text-slate-700 mb-1 font-medium">Verification URL</label>
          <input type="url" id="cert-url" class="sb-input" placeholder="https://aws.amazon.com/verify/..." required>
        </div>

        <div class="pt-3 border-t border-slate-100 flex justify-end gap-2">
          <button type="button" onclick="closeAddCertModal()" class="sb-btn sb-btn-secondary">Cancel</button>
          <button type="submit" class="sb-btn sb-btn-primary">Save Credential</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/store.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    function renderCerts() {
      if (!window.SkillBridgeStore) return;
      const std = window.SkillBridgeStore.getCurrentStudent();
      if (!std) return;

      const container = document.getElementById('certs-container');
      container.innerHTML = '';
      const certs = std.certificates || [];

      if (certs.length === 0) {
        container.innerHTML = `
          <div class="col-span-full sb-card p-12 text-center space-y-3">
            <span class="material-symbols-outlined text-4xl text-slate-400">workspace_premium</span>
            <h3 class="text-base font-bold text-slate-900">No Credentials Added</h3>
            <p class="text-xs text-slate-500 max-w-sm mx-auto">Upload and attach verifiable course completions and industry certifications to your profile.</p>
            <button onclick="openAddCertModal()" class="sb-btn sb-btn-primary">Add Your First Certificate</button>
          </div>
        `;
        return;
      }

      certs.forEach(cert => {
        const card = document.createElement('div');
        card.className = 'sb-card p-6 flex flex-col justify-between space-y-4 sb-card-interactive';
        card.innerHTML = `
          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <div class="w-9 h-9 rounded-lg bg-amber-50 border border-amber-100 flex items-center justify-center text-amber-700">
                <span class="material-symbols-outlined text-xl">verified</span>
              </div>
              <span class="sb-badge sb-badge-emerald text-[10px]">Verified Credential</span>
            </div>
            <div>
              <h3 class="text-sm font-bold text-slate-900">${cert.name}</h3>
              <p class="text-xs text-slate-500">${cert.issuer} &bull; Issued ${cert.date}</p>
            </div>
            <div class="text-[11px] text-slate-600 bg-slate-50 p-2.5 rounded-lg border border-slate-200 font-mono">
              ID: ${cert.credentialId}
            </div>
          </div>

          <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs">
            <a href="${cert.url || '#'}" target="_blank" class="text-blue-600 hover:underline flex items-center gap-1 font-medium">
              <span>Verify Link</span>
              <span class="material-symbols-outlined text-xs">open_in_new</span>
            </a>
            <button onclick="deleteCert('${cert.id}')" class="text-slate-400 hover:text-rose-600 transition p-1" title="Remove Certificate">
              <span class="material-symbols-outlined text-base">delete</span>
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openAddCertModal() {
      document.getElementById('add-cert-modal').classList.remove('hidden');
    }

    function closeAddCertModal() {
      document.getElementById('add-cert-modal').classList.add('hidden');
    }

    function deleteCert(certId) {
      if (confirm('Remove this certificate from your profile?')) {
        window.SkillBridgeStore.deleteCertificate(certId);
        renderCerts();
      }
    }

    document.getElementById('add-cert-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('cert-name').value;
      const issuer = document.getElementById('cert-issuer').value;
      const date = document.getElementById('cert-date').value;
      const credentialId = document.getElementById('cert-id').value;
      const url = document.getElementById('cert-url').value;

      window.SkillBridgeStore.addCertificate({ name, issuer, date, credentialId, url });
      closeAddCertModal();
      document.getElementById('add-cert-form').reset();
      renderCerts();
    });

    window.addEventListener('skillbridge-state-change', renderCerts);
    window.addEventListener('skillbridge:update', renderCerts);
    document.addEventListener('DOMContentLoaded', renderCerts);
  </script>
</body>
</html>
