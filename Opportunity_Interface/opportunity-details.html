const levels=o.skills.map((s,i)=>Math.max(55,o.match-(i*5)));
document.getElementById("skillBars").innerHTML=o.skills.map((s,i)=>`<div><div class="flex justify-between text-sm mb-1"><span>${s}</span><span class="text-primary">${levels[i]}%</span></div><div class="bar"><i style="width:${levels[i]}%"></i></div></div>`).join("");

function saveRole(){const key=`saved_${type}_${id}`;localStorage.setItem(key,"1");alert("Saved successfully.")}
function takeAction(){alert(`${type==="workshops"?"Registration":"Application"} started for ${o.title}.`)}
