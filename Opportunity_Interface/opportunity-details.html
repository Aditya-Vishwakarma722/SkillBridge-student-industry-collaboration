<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opportunity Details — SkillBridge</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/design-system.css">
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-900">

  <main class="flex-1 max-w-5xl mx-auto px-4 sm:px-6 py-8 w-full space-y-6">

    <!-- Breadcrumb -->
    <div class="flex items-center gap-2 text-xs text-slate-500">
      <a href="Opportunities_Interface.html" class="hover:text-slate-900 transition flex items-center gap-1">
        <span class="material-symbols-outlined text-sm">arrow_back</span>
        <span>Back to Opportunities</span>
      </a>
      <span>/</span>
      <span class="text-slate-800 font-medium" id="bread-title">Opportunity Details</span>
    </div>

    <!-- Main Opportunity Card -->
    <div class="sb-card p-6 sm:p-8 space-y-6" id="detail-card">
      <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4 border-b border-slate-200 pb-6">
        <div class="space-y-1.5">
          <div class="flex items-center gap-2 flex-wrap">
            <h1 class="text-2xl font-bold text-slate-900" id="opp-title">Position Title</h1>
            <span class="sb-badge sb-badge-blue" id="opp-type">Internship</span>
            <span class="sb-badge sb-badge-muted" id="opp-company">Company Name</span>
          </div>
          <p class="text-xs text-slate-500" id="opp-meta">Location &bull; Stipend &bull; Deadline</p>
        </div>

        <div id="opp-action-container" class="shrink-0">
          <!-- Button injected dynamically -->
        </div>
      </div>

      <!-- Description -->
      <div class="space-y-2 text-xs text-slate-600 leading-relaxed">
        <h2 class="text-sm font-bold text-slate-900">About the Role</h2>
        <p id="opp-desc">Loading role description...</p>
      </div>

      <!-- Skill Vector Matching Gate Benchmark Table -->
      <div class="space-y-3 pt-4 border-t border-slate-200">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-slate-900">Candidate Skill Vector Match Check</h2>
          <span class="text-xs font-mono font-bold text-emerald-700" id="opp-match-percent">100% Match</span>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs border border-slate-200 rounded-xl overflow-hidden">
            <thead class="bg-slate-100 text-slate-700 font-semibold border-b border-slate-200">
              <tr>
                <th class="p-3">Required Skill Domain</th>
                <th class="p-3">Company Threshold</th>
                <th class="p-3">Your Verified Score</th>
                <th class="p-3 text-right">Status</th>
              </tr>
            </thead>
            <tbody id="opp-benchmark-table" class="divide-y divide-slate-100 bg-white">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </main>

  <script src="../js/store.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    function renderDetails() {
      if (!window.SkillBridgeStore) return;
      const urlParams = new URLSearchParams(window.location.search);
      const oppId = urlParams.get('id') || 'opp_1';

      const state = window.SkillBridgeStore.getState();
      const opp = (state.opportunities || []).find(o => o.id === oppId);
      const student = window.SkillBridgeStore.getCurrentStudent();
      const skills = (student && student.skills) || {};

      if (!opp) {
        document.getElementById('opp-title').innerText = 'Opportunity Not Found';
        return;
      }

      document.getElementById('bread-title').innerText = opp.title;
      document.getElementById('opp-title').innerText = opp.title;
      document.getElementById('opp-type').innerText = opp.type;
      document.getElementById('opp-company').innerText = opp.companyName;
      document.getElementById('opp-meta').innerText = `${opp.location} • Stipend: ${opp.stipend} • ${opp.openings} Openings • Apply by ${opp.deadline}`;
      document.getElementById('opp-desc').innerText = opp.description;

      const evalRes = window.SkillBridgeStore.evaluateEligibility(skills, opp.requiredSkills);
      document.getElementById('opp-match-percent').innerText = `${evalRes.matchScore}% Vector Match`;

      // Render Benchmarks
      const tbody = document.getElementById('opp-benchmark-table');
      tbody.innerHTML = '';

      for (const [sName, reqScore] of Object.entries(opp.requiredSkills || {})) {
        const userScore = skills[sName] || 500;
        const met = userScore >= reqScore;

        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="p-3 font-semibold text-slate-900">${sName}</td>
          <td class="p-3 font-mono text-slate-600">${reqScore} / 1000</td>
          <td class="p-3 font-mono font-bold ${met ? 'text-emerald-700' : 'text-amber-700'}">${userScore} / 1000</td>
          <td class="p-3 text-right">
            ${met 
              ? '<span class="sb-badge sb-badge-emerald text-[10px]">Threshold Met</span>'
              : `<a href="../Assessment_Interface/index.html?skill=${encodeURIComponent(sName)}" class="text-blue-600 hover:underline font-semibold">Test Deficit (-${reqScore - userScore}) &rarr;</a>`
            }
          </td>
        `;
        tbody.appendChild(row);
      }

      // Check if already applied
      const alreadyApplied = (state.applications || []).some(a => a.studentId === student.id && a.opportunityId === opp.id);
      const actionContainer = document.getElementById('opp-action-container');

      if (alreadyApplied) {
        actionContainer.innerHTML = `
          <a href="../Student_Interface/My_Applications.html" class="sb-btn sb-btn-secondary text-xs">
            <span class="material-symbols-outlined text-xs">check</span>
            <span>Applied (View Status)</span>
          </a>
        `;
      } else if (evalRes.eligible) {
        actionContainer.innerHTML = `
          <button onclick="applyNow('${opp.id}')" class="sb-btn sb-btn-primary text-xs">
            <span>Apply with Verified Vector</span>
            <span class="material-symbols-outlined text-xs">arrow_forward</span>
          </button>
        `;
      } else {
        actionContainer.innerHTML = `
          <button disabled class="sb-btn sb-btn-secondary text-xs opacity-60 cursor-not-allowed">
            <span>Skill Deficit (Cannot Apply)</span>
          </button>
        `;
      }
    }

    function applyNow(oppId) {
      const student = window.SkillBridgeStore.getCurrentStudent();
      if (!student) return;

      const success = window.SkillBridgeStore.applyToOpportunity(oppId);
      if (success) {
        alert('Application submitted! Proceeding to proctored screening.');
        window.location.href = '../Student_Interface/My_Applications.html';
      }
    }

    window.addEventListener('skillbridge-state-change', renderDetails);
    window.addEventListener('skillbridge:update', renderDetails);
    document.addEventListener('DOMContentLoaded', renderDetails);
  </script>
</body>
</html>
